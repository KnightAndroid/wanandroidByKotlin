//自定义gradle脚本-api模块的生成 为了生成-api后缀模块的脚本
//链接：https://juejin.cn/post/6945413567285821453
gradle.projectsLoaded {
    // 自动为module引入生成的module-api
    gradle.rootProject.allprojects.forEach { Project p ->
        p.afterEvaluate {
            def apiProject = gradle.rootProject.allprojects.find {
                it.name.endsWith("${p.name}-api")
            }
            if (apiProject != null) {
                p.dependencies.add("api", apiProject)
            }
        }
    }
}
//自定义include
ext.includeWithApi = { String moduleName ->
    include(moduleName)
    String originDir = project(moduleName).projectDir
    String targetDir = "${originDir}-api"

    def selfName = "${project(moduleName).name}"
    def prefixName = moduleName.substring(0, moduleName.length() - selfName.length())
    //新模块的路径
    def sdkName = "${project(moduleName).name}-api"

    // 每次编译删除之前的文件
    deleteDir(targetDir)
    //复制.api文件到新的路径
    // 注意：这里不用 Gradle 的 copy{}，因为它在复制完成后会调用 chmod 设置
    // 文件权限，在 Windows 上会抛 "Could not set file mode ... does not exist"
    // 导致配置阶段直接失败。改用普通文件 IO 复制，不涉及权限设置。
    copyApiFiles(originDir, targetDir)

    def build = new File(targetDir + "/api.gradle")
    if (build.exists()) {
        build.renameTo(new File(targetDir + "/build.gradle"))
    }

    // 重命名.api文件，生成正常的.java文件
    renameApiFiles(targetDir, '.api', '.java')
    renameApiFiles(targetDir, '.kapi', '.kt')

    //删除空文件夹
    deleteEmptyDir(new File(targetDir))
    //正常加载新的模块
    include prefixName + "$sdkName"
}


private void deleteEmptyDir(File dir) {
    if (dir.isDirectory()) {
        File[] fs = dir.listFiles();
        if (fs != null && fs.length > 0) {
            for (int i = 0; i < fs.length; i++) {
                File tmpFile = fs[i];
                if (tmpFile.isDirectory()) {
                    deleteEmptyDir(tmpFile);
                }
                if (tmpFile.isDirectory() && tmpFile.listFiles().length <= 0) {
                    tmpFile.delete()
                }
            }
        }
        if (dir.isDirectory() && dir.listFiles().length == 0) {
            dir.delete()
        }
    }
}

private void deleteDir(String targetDir) {
    FileTree targetFiles = fileTree(targetDir)
    targetFiles.exclude "*.iml"
    targetFiles.each { File file ->
        file.delete()
    }
}

/**
 * 复制 api 模块所需的源文件：.api、.kapi、api.gradle
 * 排除 build 目录与 res 目录，等价于原来 copy{} 中的 exclude 规则
 */
private void copyApiFiles(String originDir, String targetDir) {
    File origin = new File(originDir)
    if (!origin.exists()) {
        return
    }
    String originPath = origin.absolutePath
    origin.eachFileRecurse { File file ->
        if (!file.isFile()) {
            return
        }
        String relative = file.absolutePath.substring(originPath.length()).replace('\\', '/')
        if (relative.startsWith('/')) {
            relative = relative.substring(1)
        }
        if (relative.startsWith('build/') || relative.contains('/build/')) {
            return
        }
        if (relative.startsWith('res/') || relative.contains('/res/')) {
            return
        }
        boolean apiFile = file.name.endsWith('.api') ||
                file.name.endsWith('.kapi') ||
                file.name == 'api.gradle'
        if (!apiFile) {
            return
        }
        File target = new File(targetDir, relative)
        target.parentFile.mkdirs()
        if (target.exists()) {
            target.delete()
        }
        target.bytes = file.bytes
    }
}


private def renameApiFiles(root_dir, String suffix, String replace) {
    FileTree files = fileTree(root_dir).include("**/*$suffix")
    files.each {
        File file ->
            file.renameTo(new File(file.absolutePath.replace(suffix, replace)))
    }
}